org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental compiler leaves .tab cache files locked on Windows,
# which fails the build with "Could not close incremental caches". Full
# recompilation of the handful of plugin modules here costs little.
kotlin.incremental=false

# Keep the Kotlin compiler in the Gradle process rather than a separate daemon,
# which avoids a second JVM competing for the same cache files.
kotlin.compiler.execution.strategy=in-process
