# Manymail analysis configuration.
#
# Stricter than the Flutter default: this app handles credentials and builds
# network protocol messages, so we want the analyzer catching as much as it can.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Generated drift code and unawaited futures are the two things most likely
    # to bite us, so treat them as build-breaking rather than advisory.
    unawaited_futures: error
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**

linter:
  rules:
    - avoid_print
    - prefer_single_quotes
    - prefer_final_locals
    - unawaited_futures
    - always_declare_return_types
    - avoid_empty_else
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - omit_local_variable_types
    - prefer_const_constructors
    - prefer_const_declarations
    - require_trailing_commas
    - sort_child_properties_last
    - use_super_parameters
